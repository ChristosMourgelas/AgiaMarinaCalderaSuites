<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agia Marina Suites — Contact</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Outfit:wght@300;400;500&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>

<body class="h-full bg-white text-charcoal font-sans">

  <div id="toast-banner"
    class="fixed top-6 left-1/2 -translate-x-1/2 z-[100] bg-charcoal text-white px-6 py-4 shadow-2xl flex items-center gap-3 transition-all duration-500 -translate-y-32 opacity-0 pointer-events-none">
    <i data-lucide="check-circle" class="w-5 h-5 text-accent"></i>
    <span class="text-sm tracking-wide font-light">Message sent successfully! We will get back to you soon.</span>
  </div>

  <div id="header-placeholder"></div>

  <main class="pt-32 pb-20 px-6">
    <div class="max-w-4xl mx-auto">
      <h1 class="font-serif text-4xl md:text-5xl font-light text-center mb-4 fade-in">Get in Touch</h1>
      <p class="text-stone text-center mb-16 max-w-xl mx-auto fade-in">Have questions? We'd love to hear from you.
        Contact us
        anytime.</p>

      <div class="grid md:grid-cols-2 gap-12">
        <div class="fade-in">
          <form id="contact-form" class="space-y-6">
            <div class="hidden" aria-hidden="true">
              <input type="text" name="hp_phone" id="hp_phone" tabindex="-1" autocomplete="off">
            </div>
            <div>
              <label for="name" class="block text-sm tracking-widest uppercase mb-2 font-light">Name</label>
              <input type="text" id="name" name="name" required
                class="w-full border border-warm bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-charcoal transition-colors"
                placeholder="Your name">
            </div>
            <div>
              <label for="email" class="block text-sm tracking-widest uppercase mb-2 font-light">Email</label>
              <input type="email" id="email" name="email" required
                class="w-full border border-warm bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-charcoal transition-colors"
                placeholder="Your email">
            </div>
            <div>
              <label for="message" class="block text-sm tracking-widest uppercase mb-2 font-light">Message</label>
              <textarea id="message" name="message" rows="5" required
                class="w-full border border-warm bg-transparent px-4 py-3 text-sm focus:outline-none focus:border-charcoal transition-colors resize-none"
                placeholder="Your message"></textarea>
            </div>
            <button type="submit"
              class="bg-charcoal text-white px-8 py-3 text-sm tracking-widest uppercase hover:bg-stone transition-colors w-full">Send
              Message</button>
          </form>
        </div>

        <div class="fade-in">
          <h3 class="font-serif text-2xl font-light mb-8">Contact Information</h3>
          <div class="space-y-8">
            <div>
              <p class="text-xs tracking-widest uppercase font-light mb-2 text-stone">Phone</p>
              <a href="tel:+306955153916" class="block text-md tracking-widest uppercase mb-2 font-light">+30 695 515
                3916</a>

              <a href="tel:+306983354237" class="block text-md tracking-widest uppercase mb-2 font-light">+30 698 335
                4237</a>
            </div>
            <div>
              <p class="text-xs tracking-widest uppercase font-light mb-2 text-stone">Email</p>
              <a href="mailto:info@agiamarinacalderasuites.com"
                class="font-serif text-xl hover:text-accent transition-colors">info@agiamarinacalderasuites.com</a>
            </div>
            <div>
              <p class="text-xs tracking-widest uppercase font-light mb-2 text-stone">Address</p>
              <p class="font-serif text-lg">Megalochori, Santorini</p>
              <p class="font-serif text-lg">Postal Code: 84700</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <div id="footer-placeholder"></div>
  <script src="script.js"></script>
</body>

</html>
