<!doctype html>
<html lang="en" class="h-full">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agia Marina Suites — Gallery</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Outfit:wght@300;400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="lightbox.css">
</head>

<body class="h-full bg-white text-charcoal font-sans">

  <div id="header-placeholder"></div>

          data-src="https://www.calderastories.eu/sites/calderastories/files/photos/13.jpg"
          style="background-image: url('https://www.calderastories.eu/sites/calderastories/files/photos/13.jpg'); background-size: cover; background-position: center;">

          class="gallery-item aspect-square cursor-pointer rounded-sm transition-transform duration-300 hover:scale-105 hover:shadow-lg"
          data-src="https://www.calderastories.eu/sites/calderastories/files/photos/14.jpg"
          style="background-image: url('https://www.calderastories.eu/sites/calderastories/files/photos/14.jpg'); background-size: cover; background-position: center;">
        </div>
        <div
          class="gallery-item aspect-square cursor-pointer rounded-sm transition-transform duration-300 hover:scale-105 hover:shadow-lg"
          data-src="https://www.calderastories.eu/sites/calderastories/files/photos/17.jpg"
          style="background-image: url('https://www.calderastories.eu/sites/calderastories/files/photos/17.jpg'); background-size: cover; background-position: center;">

          style="background-image: url('https://www.calderastories.eu/sites/calderastories/files/photos/79.jpg'); background-size: cover; background-position: center;">
        </div>
        <div
          class="gallery-item aspect-square cursor-pointer rounded-sm transition-transform duration-300 hover:scale-105 hover:shadow-lg"
          data-src="https://www.calderastories.eu/sites/calderastories/files/photos/35.jpg"
          style="background-image: url('https://www.calderastories.eu/sites/calderastories/files/photos/35.jpg'); background-size: cover; background-position: center;">
        </div>
        <div
          class="gallery-item aspect-square cursor-pointer rounded-sm transition-transform duration-300 hover:scale-105 hover:shadow-lg"
          data-src="https://www.calderastories.eu/sites/calderastories/files/photos/12.jpg"
          style="background-image: url('https://www.calderastories.eu/sites/calderastories/files/photos/12.jpg'); background-size: cover; background-position: center;">

        </div>
      </div>
    </div>
  </main>

  <div id="lightbox"
    class="fixed inset-0 bg-black/95 z-[100] transition-opacity duration-300 opacity-0 pointer-events-none touch-none overflow-hidden"
    onclick="handleBackgroundClick(event)">
    <button onclick="changeSlide(-1)"
      class="absolute left-4 md:left-10 top-1/2 -translate-y-1/2 text-white/70 hover:text-white text-6xl font-light transition-colors z-[101] hidden md:block">&lsaquo;</button>
    <button onclick="closeLightbox(true)"
      class="absolute top-6 right-6 text-white/70 hover:text-white text-4xl font-light transition-colors z-[101]">&times;</button>

    <div id="slider-container" class="slider-container">
      <div class="slide"><img id="slide-prev" src="" alt="Previous"></div>
      <div class="slide"><img id="slide-current" src="" alt="Current"></div>
      <div class="slide"><img id="slide-next" src="" alt="Next"></div>
    </div>

    <button onclick="changeSlide(1)"
      class="absolute right-4 md:right-10 top-1/2 -translate-y-1/2 text-white/70 hover:text-white text-6xl font-light transition-colors z-[101] hidden md:block">&rsaquo;</button>
  </div>

  <div id="footer-placeholder"></div>

  <script src="script.js"></script>
  <script src="lightbox.js"></script>

</body>

</html>
